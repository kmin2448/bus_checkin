<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>탑승 현황 · 운영자</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#F3F2EF; --ink:#0A0C0F; --gray:#6B7280; --btn:#CBD3DD; --btnbg:#EDF1F9;
    --hair:#E7E5DE; --navy:#1E3A5F;
    --blue:#2F6BFF; --warn:#C0392B; --go:#127A43;
    --r:5px; --shadow:0 6px 20px rgba(30,40,60,.07);
    --mono: ui-monospace,"SFMono-Regular","Menlo",monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100dvh;color:var(--ink);background:var(--bg);
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:30px 16px calc(44px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:560px;margin:0 auto}
  .kicker{margin:0 0 12px;font-size:12px;font-weight:700;color:var(--gray)}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
  h1{margin:0;font-size:34px;line-height:1.06;font-weight:800;letter-spacing:-.045em}
  .ghost{font-size:19px;font-weight:800;letter-spacing:-.04em;color:#E2E0D9;white-space:nowrap;padding-top:6px}
  h2{font-size:13px;font-weight:700;margin:30px 0 10px;color:var(--gray)}
  input,button{font-family:inherit}
  input[type=password]{width:100%;height:44px;padding:0 13px;border:1px solid var(--btn);
    border-radius:var(--r);background:#fff;font-size:15px;color:var(--ink)}
  input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,58,95,.14)}
  button{height:44px;padding:0 14px;font-size:15px;font-weight:700;color:#000;background:var(--btnbg);
    border:1px solid var(--btn);border-radius:var(--r);cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
  button.small{font-size:13px;padding:0 10px}
  button.hl{background:#fff;border:1.5px solid var(--navy);color:var(--navy);font-weight:800}
  button:focus-visible{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(30,58,95,.14)}
  .linkbtn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 18px;
    border:1px solid var(--btn);border-radius:var(--r);background:var(--btnbg);color:#000;
    font-weight:700;font-size:15px;text-decoration:none;white-space:nowrap}
  .row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:nowrap;margin-top:12px}
  .row > button,.row > .linkbtn{flex:1 1 0;min-width:0}
  /* 편 선택 탭 안에 그 편의 취합 On/Off 스위치를 같이 둔다. */
  .tabs{display:flex;gap:8px;margin-bottom:10px}
  .tab{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:8px;height:56px;
    padding:0 7px 0 12px;background:var(--btnbg);border:1px solid var(--btn);
    border-radius:var(--r);cursor:pointer}
  .tab.on{background:#fff;box-shadow:inset 0 -3px 0 var(--blue)}
  .tab-pick{flex:1 1 0;min-width:0;height:100%;padding:0;border:0;background:transparent;
    color:var(--gray);font-weight:700;font-size:15px;justify-content:flex-start;
    letter-spacing:-.02em;overflow:hidden}
  .tab.on .tab-pick{color:#000;font-weight:800}
  .tab-pick:focus-visible{outline:none;box-shadow:none;
    text-decoration:underline;text-underline-offset:4px}
  .switch{flex:none;position:relative;width:62px;height:32px;padding:0;border-radius:16px;
    border:1px solid var(--btn);background:#E6E8EC;
    transition:background .18s ease,border-color .18s ease}
  .switch .knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(20,24,32,.25);transition:transform .18s ease}
  .switch .lab{position:absolute;top:0;right:9px;height:100%;display:flex;align-items:center;
    font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--gray)}
  .switch.on{background:#DCEBE2;border-color:#9EC6AF}
  .switch.on .knob{transform:translateX(30px)}
  .switch.on .lab{right:auto;left:10px;color:var(--go)}
  .switch:disabled{opacity:.6;cursor:progress}
  .swhint{font-size:13px;color:var(--gray);line-height:1.7;margin:0;text-align:center}
  .counts{display:flex;gap:10px}
  .count{flex:1;background:#fff;border:1px solid var(--hair);border-radius:var(--r);padding:15px;text-align:center}
  .count .n{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .count .k{font-size:12px;color:var(--gray);margin-top:7px}
  .count.left .n{color:var(--warn)}
  .stamp{font-size:12px;color:var(--gray);text-align:center;margin:10px 0 0}
  ul{list-style:none;margin:0;padding:0;background:#fff;border:1px solid var(--hair);
    border-radius:var(--r);overflow:hidden}
  li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--hair)}
  li:first-child{border-top:0}
  li .nm{font-weight:700;font-size:16px;letter-spacing:-.01em}
  li .ph{font-family:var(--mono);font-size:13px;color:var(--gray);text-decoration:none}
  li .grow{flex:1;min-width:0}
  li .at{font-family:var(--mono);font-size:13px;color:var(--go);font-weight:600}
  li button{flex:none}
  li.done{color:var(--gray)}
  li.blank{justify-content:center;color:var(--gray);font-size:14px;padding:22px 14px}
  li.gh{display:block;padding:8px 12px;background:#F7F6F3;font-size:11px;font-weight:800;
    letter-spacing:.06em;color:var(--gray)}
  .hint{font-size:13px;color:var(--gray);line-height:1.7;margin:10px 0 0;text-align:center}
  .bell{position:fixed;top:14px;right:14px;z-index:15;width:46px;height:46px;padding:0;
    box-shadow:var(--shadow)}
  .bell svg{width:22px;height:22px}
  .bell .badge{position:absolute;top:-7px;right:-7px;min-width:22px;height:22px;padding:0 5px;
    border-radius:11px;background:var(--warn);color:#fff;font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
  .mask{position:fixed;inset:0;z-index:30;background:rgba(20,24,32,.34);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .dialog{background:#fff;border-radius:var(--r);box-shadow:0 18px 44px rgba(20,24,32,.22);
    padding:22px;width:100%;max-width:420px;max-height:80vh;overflow:auto;text-align:center}
  .dialog h3{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.035em}
  .dialog .s{margin:0 0 16px;font-size:13px;color:var(--gray)}
  .reqitem{border-top:1px solid var(--hair);padding:12px 0}
  .reqitem:first-of-type{border-top:0}
  .reqitem .tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;
    border:1px solid var(--btn);border-radius:var(--r);padding:3px 7px;margin-bottom:6px;background:#fff}
  .reqitem .tag.fix{color:var(--warn)}
  .reqitem .tag.add{color:var(--blue)}
  .reqitem .nm{font-size:16px;font-weight:700}
  .reqitem .sub{font-size:13px;color:var(--gray);margin-top:3px}
  .reqitem .sub b{font-family:var(--mono);font-weight:600;color:var(--ink)}
  .reqitem .sub s{font-family:var(--mono);color:var(--gray)}
  .reqitem .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:nowrap}
  .reqitem .acts button{flex:1 1 0;min-width:0}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <section id="gate">
    <p class="kicker">OPERATOR</p>
    <div class="head"><h1>운영자<br>확인</h1><span class="ghost">staff only.</span></div>
    <input id="code" type="password" placeholder="운영 코드" autocomplete="off">
    <div class="row"><button id="enter" class="hl">열기</button></div>
    <p id="gate-msg" class="hint"></p>
  </section>

  <section id="panel" class="hidden">
    <button id="bell" class="bell" title="명단 추가/수정 요청">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.6-4.4A8 8 0 1 1 21 12z"></path>
      </svg>
      <span class="badge hidden" id="bell-n">0</span>
    </button>

    <p class="kicker" id="title-band">행사</p>
    <div class="head"><h1>탑승 현황</h1><span class="ghost">live.</span></div>

    <div class="tabs">
      <div class="tab on" id="tab-out">
        <button class="tab-pick">가는 편</button>
        <button class="switch" id="sw-out" role="switch" aria-checked="true" aria-label="가는 편 취합 On/Off">
          <span class="knob"></span><span class="lab">ON</span>
        </button>
      </div>
      <div class="tab" id="tab-back">
        <button class="tab-pick">오는 편</button>
        <button class="switch" id="sw-back" role="switch" aria-checked="true" aria-label="오는 편 취합 On/Off">
          <span class="knob"></span><span class="lab">ON</span>
        </button>
      </div>
    </div>
    <p class="swhint" id="swhint">—</p>

    <div class="counts">
      <div class="count left"><div class="n" id="c-left">0</div><div class="k">미탑승</div></div>
      <div class="count"><div class="n" id="c-done">0</div><div class="k">탑승</div></div>
      <div class="count"><div class="n" id="c-all">0</div><div class="k">전체</div></div>
    </div>
    <p class="stamp" id="stamp">—</p>

    <h2>미탑승 — 번호를 누르면 바로 전화</h2>
    <ul id="list-left"></ul>

    <h2>탑승 완료</h2>
    <ul id="list-done"></ul>

    <div class="row" style="margin-top:26px"><a class="linkbtn" href="manage.html">명단 · 관리 페이지 열기</a></div>
    <p class="hint">명단 넣기와 삭제, 차량·탑승 위치 입력은 관리 페이지에서 합니다.</p>
  </section>

</div>

<div id="req-modal" class="mask hidden" role="dialog" aria-modal="true">
  <div class="dialog">
    <h3>명단 추가/수정 요청</h3>
    <p class="s">참가자가 보낸 요청입니다. 반영하면 바로 탑승 확인을 할 수 있습니다.</p>
    <div id="req-list"></div>
    <div class="row"><button id="req-close">닫기</button></div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://jqvbuqgpgmqyviqdkzvl.supabase.co";
const SUPABASE_KEY = "sb_publishable_xZsd17tzIedGr82lVQZUXA_lx68Hfd4";
const $ = (id) => document.getElementById(id);
const LEGS = ["out","back"];
let CODE = "", LEG = "out";
let COLLECT = { out:true, back:true };

async function rpc(action, payload){
  const body = Object.assign({ leg: LEG }, payload || {});
  const res = await fetch(SUPABASE_URL + "/rest/v1/rpc/bus_admin", {
    method:"POST",
    headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY},
    body: JSON.stringify({ p_code: CODE, p_action: action, p_payload: body })
  });
  if(!res.ok) throw new Error(await res.text());
  return res.json();
}

const legLabel = (l) => l === "back" ? "오는 편" : "가는 편";

function fmtPhone(d){
  if(!d) return "";
  if(d.length === 11) return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);
  if(d.length === 10) return d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6);
  return d;
}

// 소속(1순위) → 이름(2순위). 소속 없는 사람은 맨 뒤로.
function byGroupName(a, b){
  const ga = (a.note || "").trim(), gb = (b.note || "").trim();
  if(ga !== gb){
    if(!ga) return 1;
    if(!gb) return -1;
    return ga.localeCompare(gb, "ko");
  }
  return (a.name || "").localeCompare(b.name || "", "ko");
}

function rowItem(r){
  const el = document.createElement("li");
  if(r.boarded) el.className = "done";
  const g = document.createElement("div"); g.className = "grow";
  const nm = document.createElement("div"); nm.className = "nm";
  nm.textContent = r.name + (r.note ? " · " + r.note : "");
  const a = document.createElement("a"); a.className = "ph";
  a.href = "tel:" + r.phone; a.textContent = fmtPhone(r.phone);
  g.appendChild(nm); g.appendChild(a); el.appendChild(g);
  if(r.boarded){
    const at = document.createElement("span"); at.className = "at"; at.textContent = r.at;
    const undo = document.createElement("button");
    undo.className = "small"; undo.textContent = "취소";
    undo.onclick = async () => { await rpc("undo", {id:r.id}); load(); };
    el.appendChild(at); el.appendChild(undo);
  }else{
    const mark = document.createElement("button");
    mark.className = "small"; mark.textContent = "탑승";
    mark.onclick = async () => { await rpc("mark", {id:r.id}); load(); };
    el.appendChild(mark);
  }
  return el;
}

function fillList(id, arr, msg){
  const ul = document.getElementById(id);
  ul.innerHTML = "";
  if(!arr.length){
    const el = document.createElement("li");
    el.className = "blank";
    el.textContent = msg;
    ul.appendChild(el);
    return;
  }
  let cur = null;
  arr.slice().sort(byGroupName).forEach(r => {
    const g = (r.note || "").trim();
    if(g !== cur){
      cur = g;
      const h = document.createElement("li");
      h.className = "gh";
      h.textContent = g || "소속 없음";
      ul.appendChild(h);
    }
    ul.appendChild(rowItem(r));
  });
}

function setBadge(n){
  const b = $("bell-n");
  b.textContent = n > 99 ? "99+" : String(n);
  b.classList.toggle("hidden", !n);
  $("bell").classList.toggle("hl", !!n);
}

function paintSwitches(){
  LEGS.forEach(leg => {
    const on = !!COLLECT[leg];
    const sw = $("sw-" + leg);
    sw.classList.toggle("on", on);
    sw.setAttribute("aria-checked", on ? "true" : "false");
    sw.querySelector(".lab").textContent = on ? "ON" : "OFF";
  });
  const on = LEGS.filter(l => COLLECT[l]);
  $("swhint").textContent = on.length
    ? "편 이름을 누르면 아래 명단이 바뀝니다. 지금 참가자에게 열려 있는 편: " + on.map(legLabel).join(" · ")
    : "두 편 모두 Off — 참가자 화면에 확인 버튼이 잠깁니다.";
}

function render(d){
  if(d.collecting) COLLECT = { out: !!d.collecting.out, back: !!d.collecting.back };
  $("title-band").textContent = d.title || "행사";
  $("tab-out").classList.toggle("on", LEG === "out");
  $("tab-back").classList.toggle("on", LEG === "back");
  setBadge(d.pending || 0);
  paintSwitches();

  const rows = d.rows || [];
  const left = rows.filter(r => !r.boarded);
  const done = rows.filter(r => r.boarded);
  $("c-left").textContent = left.length;
  $("c-done").textContent = done.length;
  $("c-all").textContent = rows.length;
  const t = d.totals || {};
  const other = LEG === "out" ? "back" : "out";
  const o = t[other];
  $("stamp").textContent = (o ? legLabel(other) + " " + o.done + "/" + o.all + " · " : "") +
    "갱신 " + new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});

  fillList("list-left", left, rows.length ? "모두 탑승했습니다." : "아직 명단이 없습니다. 관리 페이지에서 명단을 넣어 주세요.");
  fillList("list-done", done, "아직 확인한 사람이 없습니다.");
}

async function load(){
  try{
    const d = await rpc("list");
    if(d.status === "ok") render(d);
  }catch(e){}
}

async function openRequests(){
  $("req-modal").classList.remove("hidden");
  await loadRequests();
}
function closeRequests(){ $("req-modal").classList.add("hidden"); }

async function loadRequests(){
  const box = $("req-list");
  box.textContent = "불러오는 중…";
  let d;
  try{ d = await rpc("requests"); }catch(e){ box.textContent = "불러오지 못했습니다."; return; }
  const rows = (d && d.rows) || [];
  box.innerHTML = "";
  setBadge(rows.length);
  if(!rows.length){
    const p = document.createElement("p");
    p.className = "s"; p.style.margin = "6px 0 14px";
    p.textContent = "새 요청이 없습니다.";
    box.appendChild(p);
    return;
  }
  rows.forEach(r => {
    const fix = r.kind === "fix";
    const d1 = document.createElement("div"); d1.className = "reqitem";
    const tag = document.createElement("span");
    tag.className = "tag " + (fix ? "fix" : "add");
    tag.textContent = fix ? "번호 수정" : "명단 추가";
    const nm = document.createElement("div"); nm.className = "nm";
    nm.textContent = r.name + (r.note ? " · " + r.note : "");
    const sub = document.createElement("div"); sub.className = "sub";
    if(fix && r.old_phone){
      const s = document.createElement("s"); s.textContent = fmtPhone(r.old_phone);
      sub.appendChild(s);
      sub.appendChild(document.createTextNode("  →  "));
    }
    const b = document.createElement("b"); b.textContent = fmtPhone(r.phone);
    sub.appendChild(b);
    sub.appendChild(document.createTextNode("  ·  " + legLabel(r.leg) + "  ·  " + r.at));
    const acts = document.createElement("div"); acts.className = "acts";
    const ok = document.createElement("button");
    ok.className = "small hl"; ok.textContent = fix ? "번호 바꾸기" : "명단에 추가";
    ok.onclick = async () => { ok.disabled = true; await rpc("request_approve", {id:r.id}); await loadRequests(); load(); };
    const no = document.createElement("button");
    no.className = "small"; no.textContent = "거절";
    no.onclick = async () => {
      if(!confirm(r.name + " 요청을 거절합니다.")) return;
      await rpc("request_reject", {id:r.id}); await loadRequests(); load();
    };
    acts.appendChild(ok); acts.appendChild(no);
    d1.appendChild(tag); d1.appendChild(nm); d1.appendChild(sub); d1.appendChild(acts);
    box.appendChild(d1);
  });
}

$("bell").onclick = openRequests;
$("req-close").onclick = closeRequests;
$("req-modal").addEventListener("click", (e) => { if(e.target === $("req-modal")) closeRequests(); });
document.addEventListener("keydown", (e) => {
  if(e.key === "Escape" && !$("req-modal").classList.contains("hidden")) closeRequests();
});

async function setLeg(leg){
  LEG = leg;
  await rpc("set_leg", { leg: leg });
  load();
}
// 가는 편 / 오는 편 취합을 각각 On/Off 로 켜고 끈다.
async function toggleCollect(leg){
  const sw = $("sw-" + leg);
  const next = !COLLECT[leg];
  sw.disabled = true;
  try{
    await rpc("set_collecting", { leg: leg, open: next });
    COLLECT[leg] = next;
    paintSwitches();
  }catch(e){}
  finally{ sw.disabled = false; }
  load();
}
// 탭 몸통을 누르면 명단 보기가 바뀌고, 안에 있는 스위치는 취합만 켜고 끈다.
LEGS.forEach(leg => {
  $("tab-" + leg).onclick = (e) => { if(e.target.closest(".switch")) return; setLeg(leg); };
  $("sw-" + leg).onclick = (e) => { e.stopPropagation(); toggleCollect(leg); };
});

async function enter(){
  CODE = $("code").value.trim();
  if(!CODE) return;
  const d = await rpc("list").catch(() => null);
  if(!d || d.status !== "ok"){ $("gate-msg").textContent = "코드가 맞지 않습니다."; return; }
  LEG = d.active_leg || "out";
  localStorage.setItem("bus_admin_code", CODE);
  $("gate").classList.add("hidden");
  $("panel").classList.remove("hidden");
  render(d);
  setInterval(load, 7000);
}
$("enter").onclick = enter;
$("code").addEventListener("keydown", e => { if(e.key === "Enter") enter(); });

const saved = new URLSearchParams(location.search).get("code") || localStorage.getItem("bus_admin_code");
if(saved){ $("code").value = saved; enter(); }
</script>
</body>
</html>
